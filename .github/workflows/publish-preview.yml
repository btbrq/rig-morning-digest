name: Publish digest preview

on:
  workflow_dispatch:
    inputs:
      lane_marker:
        description: Marker to include in the public preview; leave empty to remove it.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: digest-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - run: pnpm install --frozen-lockfile
      - name: Render the digest page
        env:
          LANE_ID: lane-07
          LANE_MARKER: ${{ inputs.lane_marker }}
        run: |
          set -eu
          mkdir -p site
          ./node_modules/.bin/tsx --env-file-if-exists=.env src/server.ts > /tmp/rig.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 1 --max-time 5 \
            --output site/index.html \
            http://127.0.0.1:8787/digest/2026-10-28
          test -s site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
